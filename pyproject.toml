[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tlk-parser"
version = "1.0.0"
description = "Read, transform, and write BioWare TLK V1 dialogue files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "mldelaney94" }]
keywords = ["tlk", "bioware", "kotor", "dialogue", "parser"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/mldelaney94/tlk_v1_parser"
Repository = "https://github.com/mldelaney94/tlk_v1_parser"
Issues = "https://github.com/mldelaney94/tlk_v1_parser/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tlk_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tlk_parser"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
